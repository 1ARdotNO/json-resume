name: Deploy resume to GitHub Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches: [main]
  # Rebuild weekly (Mondays 07:00 UTC) to catch any gist edits; the resume
  # rarely changes, so use the manual run below to publish an edit immediately.
  schedule:
    - cron: '0 7 * * 1'
  # Allow manual runs from the Actions tab (Run workflow) to deploy on demand.
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          # Raises the GitHub API rate limit for the gist fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Override any of these via repository variables to point the site at
          # a different gist, user, theme, or domain without editing code.
          RESUME_USER: ${{ vars.RESUME_USER }}
          RESUME_GIST: ${{ vars.RESUME_GIST }}
          RESUME_URL: ${{ vars.RESUME_URL }}
          RESUME_THEME: ${{ vars.RESUME_THEME }}
          RESUME_DOMAIN: ${{ vars.RESUME_DOMAIN || 'resume.1ar.no' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
